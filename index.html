<!doctype html><html lang="zh-Hant"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Micky 工作中心</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#202124;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}
.app{max-width:720px;margin:auto;padding:18px 16px 90px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
h1{font-size:25px;margin:0}.date,.muted{color:#777;font-size:13px}.add{width:100%;padding:14px;border-radius:14px;background:#202124;color:white;font-weight:700;margin-bottom:14px;border:0}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:14px}.tabs button,.small{padding:10px 5px;border-radius:12px;background:white;border:1px solid #e4e5e7;font-size:13px}
.tabs button.active{background:#202124;color:white}.card{background:white;border:1px solid #e4e5e7;border-radius:17px;padding:16px;margin-bottom:12px}
.card h2{font-size:17px;margin:0 0 4px}.task{display:flex;gap:11px;padding:13px 0;border-bottom:1px solid #eee}.task:last-child{border-bottom:0}
.check{width:22px;height:22px;border:2px solid #aaa;border-radius:6px;background:white;flex:0 0 auto}.check.done{background:#202124;color:white;border-color:#202124}.check.done:after{content:"✓";font-size:14px}
.task.done .title{text-decoration:line-through;color:#999}.title{font-weight:650}.meta{font-size:12px;color:#777;margin-top:4px}
.tag{display:inline-block;padding:3px 7px;border:1px solid #ddd;border-radius:99px;font-size:11px;margin:6px 5px 0 0}
input,select{width:100%;padding:12px;border:1px solid #ddd;border-radius:11px;background:white;font-size:16px}.row{display:flex;gap:8px}.row>*{flex:1}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.38);display:none;align-items:flex-end;justify-content:center}.modal.show{display:flex}
.sheet{background:white;width:min(720px,100%);border-radius:22px 22px 0 0;padding:18px}.sheet h2{margin:0 0 14px}.field{margin:10px 0}.field label{display:block;font-size:13px;color:#666;margin-bottom:5px}
.save{width:100%;padding:13px;border-radius:12px;background:#202124;color:white;font-weight:700;margin-top:8px;border:0}.empty{text-align:center;color:#999;padding:25px 0}
.customer{padding:13px 0;border-bottom:1px solid #eee}.customer:last-child{border-bottom:0}.small{cursor:pointer}
@media(min-width:650px){.modal{align-items:center}.sheet{border-radius:20px;max-width:560px}}
</style></head>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f6f6f6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#222}
#v6{max-width:780px;margin:auto;padding:14px}
.card{background:#fff;border:1px solid #ddd;border-radius:16px;padding:14px;margin:10px 0}
.title{font-weight:800;font-size:18px;margin-bottom:8px}
textarea,input,select{font:inherit}
.capture textarea{width:100%;min-height:78px;border:1px solid #ccc;border-radius:12px;padding:11px;font-size:16px;resize:vertical}
.btn{border:0;border-radius:10px;padding:9px 13px;font-weight:700;cursor:pointer}
.primary{background:#111;color:#fff}.light{background:#eee}
.notebook{background:#fffdf5;border:1px solid #e6dfc7}
.notebook textarea{width:100%;min-height:100px;border:1px solid #d8d0b9;border-radius:12px;padding:11px;font-size:16px;resize:vertical;background:#fffef9}
.note{padding:10px;border-bottom:1px solid #e8e1cf;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.note:last-child{border-bottom:0}.note-text{white-space:pre-wrap;line-height:1.5}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:12px 0}
.tab{border:1px solid #ddd;background:#fff;border-radius:10px;padding:10px 5px;cursor:pointer}
.tab.active{font-weight:800;background:#eaeaea}
.search{width:100%;padding:10px;border:1px solid #ccc;border-radius:10px;margin:8px 0}
.section{margin:18px 0}.section h3{font-size:17px;margin:0 0 8px}
.item{background:#fff;border:1px solid #ddd;border-radius:14px;padding:12px;margin:8px 0}
.meta{font-size:13px;color:#666;margin-top:5px;line-height:1.5}
.actions{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.actions button{border:0;border-radius:8px;padding:7px 9px;cursor:pointer}
.badge{display:inline-block;padding:3px 7px;border-radius:7px;background:#eee;font-size:12px;margin-left:5px}
.empty{color:#777;font-size:14px;padding:8px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);align-items:center;justify-content:center;padding:15px;z-index:99}
.modal.open{display:flex}.modalbox{background:#fff;border-radius:16px;padding:16px;width:min(520px,100%);max-height:90vh;overflow:auto}
.field{margin:8px 0}.field label{font-size:13px;color:#555;display:block;margin-bottom:4px}
.field input,.field textarea,.field select{width:100%;padding:9px;border:1px solid #ccc;border-radius:9px}
@media(max-width:520px){.tabs{grid-template-columns:repeat(2,1fr)}}
</style>

<div id="v6">
  <!-- 今日記事本：完全獨立，不分類 -->
  <div class="card notebook">
    <div class="title">📝 今日記事本</div>
    <div style="font-size:13px;color:#777;margin-bottom:8px">
      只記今天臨時要回報、提醒自己的事情，不會自動分類。
    </div>
    <textarea id="noteInput" placeholder="例如：王先生今天下單，收盤後要回報&#10;陳小姐下單 XX，記得回報"></textarea>
    <div style="display:flex;gap:8px;margin-top:8px">
      <button class="btn primary" id="noteAdd">＋記下來</button>
      <button class="btn light" id="noteClear">清空輸入</button>
    </div>
    <div id="notes"></div>
  </div>

  <!-- 工作事項：自然語言自動分類 -->
  <div class="card capture">
    <div class="title">🧠 有工作事項直接打在這裡</div>
    <textarea id="input" placeholder="例如：王力宏明天要開當沖"></textarea>
    <div style="display:flex;gap:8px;margin-top:8px">
      <button class="btn primary" id="add">＋加入</button>
      <button class="btn light" id="clear">清除</button>
    </div>
    <div id="msg" class="meta"></div>
  </div>

  <div class="tabs">
    <button class="tab active" data-view="day">📅 當天必做</button>
    <button class="tab" data-view="tomorrow">🔔 明日必做</button>
    <button class="tab" data-view="week">🗓️ 行事曆</button>
    <button class="tab" data-view="waiting">⏳ 等待中</button>
    <button class="tab" data-view="customers">⭐ 客戶重點</button>
    <button class="tab" data-view="done">✅ 已完成</button>
  </div>
  <div style="font-size:13px;color:#666;margin-top:4px">🔎 這裡可以直接搜尋「客戶姓名、帳號、事項、內容、分類」</div><input id="search" class="search" placeholder="例如：王力宏、12345678、GOWIN、累積量……">
  <div id="content"></div>

  <div id="modal" class="modal"><div class="modalbox">
    <h3 style="margin-top:0">✏️ 編輯這筆事項</h3>
    <input type="hidden" id="eid">
    <div class="field"><label>客戶姓名</label><input id="ec"></div><div class="field"><label>帳號</label><input id="ea" inputmode="numeric" placeholder="可留空"></div>
    <div class="field"><label>事項</label><input id="es"></div>
    <div class="field"><label>內容／備註</label><textarea id="ed"></textarea></div>
    <div class="field"><label>分類</label><select id="ek"></select></div>
    <div class="field"><label>狀態</label><select id="est"><option>待處理</option><option>等待</option><option>已完成</option></select></div>
    <div class="field"><label>日期</label><input type="date" id="edate"></div>
    <div class="field"><label>時間</label><input type="time" id="etime"></div>
    <div style="display:flex;gap:8px;margin-top:12px">
      <button class="btn primary" id="saveEdit">儲存</button>
      <button class="btn light" id="cancelEdit">取消</button>
    </div>
  </div></div>
</div>

<script>
(function(){
const KEY='micky_work_center_v6_tasks';
const NOTE_KEY='micky_work_center_v6_notes';
const cats=['開戶','當沖','授信','手續費申請','臨櫃/代辦','約見面','額度調整','其他'];
const $=id=>document.getElementById(id);
cats.forEach(c=>{let o=document.createElement('option');o.textContent=c;$('ek').appendChild(o)});

function load(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return[]}}
function save(a){localStorage.setItem(KEY,JSON.stringify(a))}
function loadNotes(){try{return JSON.parse(localStorage.getItem(NOTE_KEY)||'[]')}catch(e){return[]}}
function saveNotes(a){localStorage.setItem(NOTE_KEY,JSON.stringify(a))}
function day(d){return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}
function today(){return day(new Date())}
function tomorrow(){let d=new Date();d.setDate(d.getDate()+1);return day(d)}
function week(){let d=new Date(), n=d.getDay(), diff=n===0?-6:1-n, m=new Date(d);m.setDate(d.getDate()+diff);let s=new Date(m);s.setDate(m.getDate()+6);return[day(m),day(s)]}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function parse(raw){
 let original=raw.trim(),s=original,customer='',account='',date='',time='',status='待處理',category='其他';

 // ===== 1. 先辨識帳號：帳號可直接緊貼姓名 =====
 let am=s.match(/(\d{6,10})(?=[\s\u4e00-\u9fffA-Za-z]|$)/);
 if(am){
   account=am[1];
   s=s.slice(0,am.index)+s.slice(am.index+am[1].length);
   s=s.trim();
 }

 // ===== 2. 日期關鍵字要先保護起來 =====
 // 先抓完整的日期詞，避免「後天」被切成姓名「後」、
 // 「明天」被切成「明」、或「當沖」被切成「當」。
 const dateTokens=[];
 const protectDate=(regex)=>{
   s=s.replace(regex,m=>{const key=`__DATE${dateTokens.length}__`;dateTokens.push(m);return key});
 };
 protectDate(/大後天/g);
 protectDate(/後天/g);
 protectDate(/明天|明日/g);
 protectDate(/今天|今日/g);
 protectDate(/下個月\s*\d{1,2}\s*(?:日|號)/g);
 protectDate(/(?:下下週|下下周|下下個禮拜|下下個星期)\s*(?:星期|週)?[一二三四五六日天]/g);
 protectDate(/(?:本週|本周|這週|這周|這個禮拜|這個星期|下週|下周|下個禮拜|下個星期)\s*(?:星期|週)?[一二三四五六日天]/g);
 protectDate(/(?:星期|週)[一二三四五六日天]/g);
 protectDate(/\d{1,2}\s*[\/\-]\s*\d{1,2}/g);
 protectDate(/\d{1,2}\s*月\s*\d{1,2}\s*(?:日|號)/g);

 // ===== 3. 再辨識客戶 =====
 // 日期可能出現在句首、姓名後面或句中；先保護日期後，再從剩餘文字找客戶。
 // 例如：今天董先生有下單、董先生下週三、下週三董先生要開額度，都要能拆開。
 const title=/([\u4e00-\u9fff]{2,6}(?:先生|小姐|女士|太太|媽媽|媽咪|阿姨|阿嬤|奶奶|叔叔|伯伯|阿伯|阿公|爺爺|老師|老闆|老闆娘|經理|主任|總|哥|姐))/;
 const boundary=/(?=\s|__DATE|$|要|說|表示|希望|請|幫|追|開|申請|辦理|調整|約|送|訪|簽|當沖|授信|額度|手續費|臨櫃|代辦|開戶)/;
 const generic=new RegExp('([\\u4e00-\\u9fff]{2,4})'+boundary.source);
 const eng=/([A-Za-z][A-Za-z.'-]{1,30})(?=\s|__DATE|$|要|說|表示|希望|請|幫|追|開|申請|辦理|調整|約|送|訪|簽|當沖|授信|額度|手續費|臨櫃|代辦|開戶)/i;
 let cm=null;

 // 有帳號時，優先找帳號後方的客戶；否則可在句中尋找。
 if(account){
   // 帳號可能出現在句首、句中或日期前後；帳號移除後，直接找其附近的姓名。
   // 例如：880317陳坤澤、今天880317陳坤澤、下週三880317陳坤澤。
   cm=s.match(/(?:^|(?:__DATE\d+__))\s*([\u4e00-\u9fff]{2,6}(?:先生|小姐|女士|太太|媽媽|媽咪|阿姨|阿嬤|奶奶|叔叔|伯伯|阿伯|阿公|爺爺|老師|老闆|老闆娘|經理|主任|總|哥|姐)|[\u4e00-\u9fff]{2,4})/);
 }
 if(!cm) cm=s.match(title);
 if(cm){
   customer=cm[1];
   s=s.slice(0,cm.index)+s.slice(cm.index+cm[0].length);
 }else{
   cm=s.match(generic);
   if(!cm) cm=s.match(eng);
   if(cm){
     customer=cm[1];
     s=s.slice(0,cm.index)+s.slice(cm.index+cm[0].length);
   }
 }

 // ===== 4. 日期還原與實際日期 =====
 const now=new Date();
 const weekdayMap={'日':0,'天':0,'一':1,'二':2,'三':3,'四':4,'五':5,'六':6};
 function makeDate(y,m,d){return day(new Date(y,m-1,d))}
 function weekdayDate(target,nextWeek=false){
   const x=new Date(now),cur=x.getDay();
   let delta=(target-cur+7)%7;
   if(nextWeek)delta+=7;
   x.setDate(x.getDate()+delta);
   return day(x);
 }

 // 從原文判斷日期，優先完整詞
 if(/大後天/.test(original)){
   let x=new Date(now);x.setDate(x.getDate()+3);date=day(x);
 }else if(/後天/.test(original)){
   let x=new Date(now);x.setDate(x.getDate()+2);date=day(x);
 }else if(/明天|明日/.test(original)){
   date=tomorrow();
 }else if(/今天|今日/.test(original)){
   date=today();
 }

 let wd=original.match(/(下下週|下下周|下下個禮拜|下下個星期|本週|本周|這週|這周|這個禮拜|這個星期|下週|下周|下個禮拜|下個星期)?\s*(?:星期|週)([一二三四五六日天])/);
 if(wd){
   const prefix=wd[1]||'';
   let weeks=0;
   if(/下下/.test(prefix)) weeks=2;
   else if(/下週|下周|下個禮拜|下個星期/.test(prefix)) weeks=1;
   const x=new Date(now),cur=x.getDay();
   let delta=(weekdayMap[wd[2]]-cur+7)%7 + weeks*7;
   x.setDate(x.getDate()+delta);
   date=day(x);
 }else{
   let wd2=original.match(/(下下週|下下周|下下個禮拜|下下個星期|本週|本周|這週|這周|這個禮拜|這個星期|下週|下周|下個禮拜|下個星期)\s*([一二三四五六日天])/);
   if(wd2){
     const prefix=wd2[1];
     let weeks=/下下/.test(prefix)?2:(/下週|下周|下個禮拜|下個星期/.test(prefix)?1:0);
     const x=new Date(now),cur=x.getDay();
     let delta=(weekdayMap[wd2[2]]-cur+7)%7 + weeks*7;
     x.setDate(x.getDate()+delta);
     date=day(x);
   }else{
     let bare=original.match(/(?:^|[\s，,])(?:星期|週)([一二三四五六日天])(?=$|[\s，,])/);
     if(bare)date=weekdayDate(weekdayMap[bare[1]],false);
   }
 }

 let nm=original.match(/下個月\s*(\d{1,2})\s*(?:日|號)/);
 if(nm){
   let y=now.getFullYear(),m=now.getMonth()+2;
   if(m>12){m=1;y++}
   date=makeDate(y,m,+nm[1]);
 }
 let sl=original.match(/(?:^|[^\d])(\d{1,2})\s*[\/\-]\s*(\d{1,2})(?!\d)/);
 if(sl)date=makeDate(now.getFullYear(),+sl[1],+sl[2]);
 let md=original.match(/(?:^|[^\d])(\d{1,2})\s*月\s*(\d{1,2})\s*(?:日|號)/);
 if(md)date=makeDate(now.getFullYear(),+md[1],+md[2]);

 // ===== 5. 時間 =====
 let tm=original.match(/(上午|下午|早上|晚上)?\s*(\d{1,2})(?:[：:點時](\d{1,2})?)?/);
 if(tm && (tm[1] || /[:：點時]/.test(tm[0]))){
   let h=+tm[2],mi=+(tm[3]||0);
   if(/下午|晚上/.test(tm[1]||'')&&h<12)h+=12;
   time=String(h).padStart(2,'0')+':'+String(mi).padStart(2,'0');
 }

 // ===== 6. 分類 =====
 if(/申請手續費|手續費|折數|[0-9]+(?:\.[0-9]+)?折/.test(original))
   category='手續費申請';
 else if(/臨櫃|要來辦理|來辦理|匯撥|臨櫃申請|要來找我|來找我/.test(original))
   category='臨櫃/代辦';
 else if(/送禮|簽文件|訪客|下台南|去桃園|約見面|見面|拜訪|拜會/.test(original))
   category='約見面';
 else if(/額度|調額|開額度|調整額度/.test(original))
   category='額度調整';
 else if(/(?:^|[^a-z])t\s*\+?\s*5(?:$|[^a-z])|t5|不限用途|信用|融資融券|便利貸款|交割款借貸/i.test(original))
   category='授信';
 else if(/當沖/.test(original))
   category='當沖';
 else if(/開戶/.test(original))
   category='開戶';

 if(/等待|等候|預計.*出來|下週.*出來|下週.*追|等公司|等經理|等客戶/.test(original))
   status='等待';

 // ===== 7. 事項 =====
 // 用「原文」但移除已辨識客戶與日期，避免把「後天／明天／當沖」切斷。
 let subject=original;
 if(account)subject=subject.replace(account,'');
 if(customer)subject=subject.replace(customer,'');
 subject=subject
   .replace(/^(說|表示|要|希望|請)\s*/,'')
   .replace(/大後天|後天|明天|明日|今天|今日/g,'')
   .replace(/(?:下下週|下下周|下下個禮拜|下下個星期|本週|本周|這週|這周|這個禮拜|這個星期|下週|下周|下個禮拜|下個星期)\s*(?:星期|週)?[一二三四五六日天]?/g,'')
   .replace(/(?:星期|週)[一二三四五六日天]/g,'')
   .replace(/下個月\s*\d{1,2}\s*(?:日|號)/g,'')
   .replace(/\d{1,2}\s*[\/\-]\s*\d{1,2}/g,'')
   .replace(/\d{1,2}\s*月\s*\d{1,2}\s*(?:日|號)/g,'')
   .replace(/(?:上午|下午|早上|晚上)?\s*\d{1,2}(?:[：:點時]\d{1,2})?/,'')
   .replace(/\s+/g,' ')
   .trim();

 if(category==='當沖' && /開當沖|申請當沖/.test(original))subject='開當沖';
 else if(category==='額度調整')subject='額度調整';
 else if(category==='約見面')subject='約見面';
 else if(category==='臨櫃/代辦')subject='臨櫃／代辦';
 else if(category==='手續費申請')subject='手續費申請';
 else if(category==='授信' && /t\s*\+?\s*5|t5|不限用途|便利貸款|交割款借貸|融資融券/i.test(original))subject='授信';

 let detail=(original.match(/(?:內容是|內容為|關注|備註)[：:\s]*(.+)$/)||[])[1]||'';

 return {
   id:Date.now()+Math.random(),
   customer,
   account,
   subject:subject||'待確認事項',
   detail:detail.trim(),
   category,status,date,time,
   raw:original,
   history:[{at:new Date().toLocaleString('zh-TW'),text:'建立：'+original}]
 };
}
function same(a,b){
 if(!a.customer||!b.customer||a.customer!==b.customer)return false;
 const norm=s=>(s||'').replace(/開|申請|追一下|追蹤|進度/g,'');
 const A=norm(a.subject),B=norm(b.subject);
 return (A&&B&&(A.includes(B)||B.includes(A))) || (a.detail&&b.detail&&a.detail===b.detail);
}
function addOrUpdate(x){
 let a=load(),i=a.findIndex(t=>same(t,x));
 if(i>=0){
   let t=a[i];
   if(x.subject)t.subject=x.subject;
   if(x.detail)t.detail=x.detail;
   if(x.category!=='其他')t.category=x.category;
   if(x.date)t.date=x.date;
   if(x.time)t.time=x.time;
   if(x.status!=='待處理')t.status=x.status;
   t.history=t.history||[];
   t.history.push({at:new Date().toLocaleString('zh-TW'),text:'更新：'+x.history[0].text});
   a[i]=t;save(a);return{t,updated:true}
 }
 a.unshift(x);save(a);return{t:x,updated:false}
}

let view='day';
function matches(t,q){
 if(!q)return true;
 return [t.customer,t.account,t.subject,t.detail,t.category,t.status,t.date,t.time,t.raw].join(' ').toLowerCase().includes(q.toLowerCase())
}
function item(t){
 return `<div class="item">
   <div><b>${esc(t.customer||'未指定客戶')}</b>${t.account?` <span style="font-size:13px;color:#777">(${esc(t.account)})</span>`:''}｜${esc(t.subject)} <span class="badge">${esc(t.category)}</span></div>
   ${t.detail?`<div class="meta">內容：${esc(t.detail)}</div>`:''}
   <div class="meta">${esc(t.status)}${t.date?' · '+t.date:''}${t.time?' '+t.time:''}</div>
   <div class="actions">
     <button onclick="edit('${t.id}')">✏️ 編輯</button>
     <button onclick="complete('${t.id}')">✅ 完成</button>
     <button onclick="del('${t.id}')">🗑️ 刪除</button>
   </div>
 </div>`;
}

function renderNotes(){
 const a=loadNotes();
 $('notes').innerHTML=a.length?a.map(n=>`
   <div class="note">
     <div class="note-text">${esc(n.text)}<div style="font-size:12px;color:#999;margin-top:4px">${esc(n.at)}</div></div>
     <button class="btn light" onclick="deleteNote('${n.id}')">刪除</button>
   </div>`).join(''):'<div class="empty">今天還沒有記事</div>';
}
window.deleteNote=function(id){
 if(confirm('確定刪除這則記事？')){
   saveNotes(loadNotes().filter(n=>String(n.id)!==String(id)));renderNotes();
 }
};

function render(){
 let a=load(),q=$('search').value.trim(),t=today(),tm=tomorrow(),[w1,w2]=week();
 a=a.filter(x=>matches(x,q));
 let title='',items=[];
 if(view==='day'){title='📅 當天必做';items=a.filter(x=>x.status!=='已完成'&&x.date===t)}
 if(view==='tomorrow'){title='🔔 明日必做';items=a.filter(x=>x.status!=='已完成'&&x.date===tm)}
 if(view==='week'){title='🗓️ 行事曆';items=a.filter(x=>x.status!=='已完成'&&x.date>=w1&&x.date<=w2)}
 if(view==='waiting'){title='⏳ 等待中';items=a.filter(x=>x.status==='等待')}
 if(view==='customers'){
   title='⭐ 客戶重點';
   const map={};
   a.forEach(x=>{const key=x.customer||'未指定客戶';(map[key]??=[]).push(x)});
   const body=Object.keys(map).length
     ?Object.keys(map).map(c=>`<div class="item"><b>${esc(c)}</b>${map[c].map(item).join('')}</div>`).join('')
     :'<div class="empty">目前沒有客戶重點</div>';
   $('content').innerHTML=`<section class="section"><h3>${title}</h3>${body}</section>`;return;
 }
 if(view==='done'){title='✅ 已完成';items=a.filter(x=>x.status==='已完成')}
 $('content').innerHTML=`<section class="section"><h3>${title}</h3>${items.length?items.map(item).join(''):'<div class="empty">目前沒有事項</div>'}</section>`;
}

window.edit=function(id){
 let t=load().find(x=>String(x.id)===String(id));if(!t)return;
 $('eid').value=t.id;$('ec').value=t.customer||'';$('ea').value=t.account||'';$('es').value=t.subject||'';$('ed').value=t.detail||'';
 $('ek').value=t.category||'其他';$('est').value=t.status||'待處理';$('edate').value=t.date||'';$('etime').value=t.time||'';
 $('modal').classList.add('open');
};
window.del=function(id){
 if(confirm('確定刪除？')){save(load().filter(x=>String(x.id)!==String(id)));render()}
};
window.complete=function(id){
 let a=load(),t=a.find(x=>String(x.id)===String(id));
 if(t){t.status='已完成';t.history=t.history||[];t.history.push({at:new Date().toLocaleString('zh-TW'),text:'標記完成'});save(a);render()}
};

$('noteAdd').onclick=function(){
 const text=$('noteInput').value.trim();if(!text)return;
 let a=loadNotes();
 a.unshift({id:Date.now()+Math.random(),text,at:new Date().toLocaleString('zh-TW')});
 saveNotes(a);$('noteInput').value='';renderNotes();
};
$('noteClear').onclick=()=>{$('noteInput').value=''};

$('add').onclick=function(){
 const raw=$('input').value.trim();if(!raw)return;
 const x=parse(raw),r=addOrUpdate(x);
 $('msg').textContent=(r.updated?'已更新原本事項：':'已自動整理：')+(r.t.customer||'未指定客戶')+(r.t.account?'（'+r.t.account+'）':'')+'｜'+r.t.subject+' · '+r.t.category;
 $('input').value='';render();
};
$('clear').onclick=()=>{$('input').value='';$('msg').textContent=''};
$('search').oninput=render;

document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
 b.classList.add('active');view=b.dataset.view;render();
});

$('cancelEdit').onclick=()=>$('modal').classList.remove('open');
$('saveEdit').onclick=function(){
 let a=load(),t=a.find(x=>String(x.id)===$('eid').value);if(!t)return;
 t.customer=$('ec').value.trim();t.account=$('ea').value.trim();t.subject=$('es').value.trim();t.detail=$('ed').value.trim();
 t.category=$('ek').value;t.status=$('est').value;t.date=$('edate').value;t.time=$('etime').value;
 // 編輯時若事項／內容明確出現分類關鍵字，自動同步分類。
 const text=(t.subject+' '+t.detail).trim();
 if(/申請手續費|手續費|折數|[0-9]+(?:\.[0-9]+)?折/.test(text))t.category='手續費申請';
 else if(/臨櫃|要來辦理|來辦理|匯撥|臨櫃申請|要來找我|來找我/.test(text))t.category='臨櫃/代辦';
 else if(/送禮|簽文件|訪客|下台南|去桃園|約見面|見面|拜訪|拜會/.test(text))t.category='約見面';
 else if(/額度|調額|開額度|調整額度/.test(text))t.category='額度調整';
 else if(/t\s*\+?\s*5|t5|不限用途|信用|融資融券|便利貸款|交割款借貸/i.test(text))t.category='授信';
 else if(/當沖/.test(text))t.category='當沖';
 else if(/開戶/.test(text))t.category='開戶';
 t.history=t.history||[];t.history.push({at:new Date().toLocaleString('zh-TW'),text:'手動編輯'});
 save(a);$('modal').classList.remove('open');render();
};

renderNotes();render();
})();
</script>
